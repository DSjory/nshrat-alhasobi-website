<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>محرر النشرة — لوحة الإدارة</title>
  <script type="module" src="/admin_cms/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/admin_cms/styles.css">
</head>
<body class="admin-cms-page">
  <div class="admin-wrapper">
    <div class="editor-shell">

      <aside class="editor-aside" id="editor-sidebar">
        <div class="sidebar-logo">
          <img src="/assets/img/شعار نشرة الحاسوبي باللون الازرق.png" alt="شعار النشرة">
        </div>

        <nav class="nav-list" aria-label="أقسام المحرر">
          <button class="nav-item active" data-tab="overview">📝 معلومات العدد</button>
          <button class="nav-item"        data-tab="contributors">👥 المساهمون</button>
          <button class="nav-item"        data-tab="sections">📚 أقسام النشرة</button>
        </nav>

        <div style="margin-top: 16px;">
          <a class="btn btn-block" href="/admin_cms/dashboard.html">← العودة للوحة</a>
        </div>

        <div class="sidebar-user-block" id="user-profile-widget"></div>
      </aside>

      <section class="editor-main" id="editor-main">

        <div class="sticky-savebar" id="savebar">
          <div class="row" style="min-width:0; flex:1;">
            <button id="hamburger" class="hamburger" aria-label="فتح القائمة" aria-controls="editor-sidebar">☰</button>
            <div class="header-titles" style="min-width:0; flex:1;">
              <p>تحرير عدد</p>
              <h1 id="editor-title" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">…</h1>
            </div>
            <span id="save-status" class="badge badge-muted" style="margin-inline-start: 8px; display:none;">●</span>
          </div>
          <div class="header-actions">
            <button id="publish-all" class="btn">حفظ الكل</button>
            <button id="save-meta" class="btn btn-primary">حفظ العدد</button>
            <button id="delete-news" class="btn btn-danger">حذف العدد</button>
          </div>
        </div>

        <div class="tabs" id="editor-tabs">
          <button class="tab active" data-tab="overview">معلومات العدد</button>
          <button class="tab"        data-tab="contributors">المساهمون</button>
          <button class="tab"        data-tab="sections">أقسام النشرة</button>
        </div>

        <!-- Tab: Overview ─────────────────────────────────────────────── -->
        <div class="tab-panel" data-panel="overview">
          <div class="card">
            <div class="card-body" id="overview-form"></div>
          </div>
        </div>

        <!-- Tab: Contributors ─────────────────────────────────────────── -->
        <div class="tab-panel" data-panel="contributors" style="display:none;">
          <div class="card">
            <div class="card-head"><h3>معدّو النشرة</h3><span class="muted">سيتم عرض هذه الأسماء في تذييل النشرة المنشورة.</span></div>
            <div class="card-body" id="contributors-form"></div>
          </div>
        </div>

        <!-- Tab: Sections ─────────────────────────────────────────────── -->
        <div class="tab-panel" data-panel="sections" style="display:none;">
          <div class="card">
            <div class="card-head">
              <h3>أقسام النشرة</h3>
              <div class="row">
                <select id="add-section-type" class="input" style="min-width: 200px;"></select>
                <button id="btn-add-section" class="btn btn-primary">+ إضافة قسم</button>
              </div>
            </div>
            <div class="card-body">
              <div id="sections" class="section-list"></div>
            </div>
          </div>
        </div>

      </section>
    </div>
  </div>

  <script type="module" src="/admin_cms/editor.js"></script>
  <script type="module" src="/js/footer-year.js"></script>
</body>
</html>
