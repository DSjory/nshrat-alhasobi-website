<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>لوحة الإدارة — نشرة الحاسوبي</title>
  <script type="module" src="/admin_cms/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/admin_cms/styles.css">
</head>
<body class="admin-cms-page">
  <div class="admin-wrapper">

    <div class="admin-layout">

      <aside class="admin-sidebar" id="admin-sidebar">
        <div class="sidebar-logo">
          <img src="/assets/img/شعار نشرة الحاسوبي باللون الازرق.png" alt="شعار النشرة">
        </div>
        <nav class="nav-list" id="sidebar-nav" aria-label="القائمة الرئيسية">
          <button id="nav-news-2"        class="nav-item active" data-key="news">📰 الأعداد</button>
          <button id="nav-categories-2"  class="nav-item"        data-key="categories">🏷️ التصنيفات</button>
          <button id="nav-join-2"        class="nav-item"        data-key="join">✉️ طلبات الانضمام</button>
          <button id="nav-audit-2"       class="nav-item"        data-key="audit">🧾 سجل التدقيق</button>
        </nav>

        <div class="sidebar-user-block" id="user-profile-widget"></div>
      </aside>

      <main class="admin-main">
        <header class="dashboard-header">
          <div class="row" style="gap:12px; flex:1; min-width:0;">
            <button id="hamburger" class="hamburger" aria-label="فتح القائمة" aria-controls="admin-sidebar">☰</button>
            <div class="header-titles">
              <p>لوحة التحكم</p>
              <h1 id="page-title">الأعداد</h1>
            </div>
          </div>
          <div class="header-actions" id="page-actions"></div>
        </header>

        <div id="content-area">
          <div class="empty-state">
            <div class="empty-state-icon">⏳</div>
            <div class="empty-state-title">يتم تحميل البيانات…</div>
          </div>
        </div>
      </main>

    </div>
  </div>

  <script type="module" src="/admin_cms/main.js"></script>
  <script type="module" src="/js/footer-year.js"></script>
</body>
</html>
